name: Delete Neon CI branch
description: Deletes the CI branch created by neon-ci-branch. Call it with if-always so cancelled and failed runs clean up too.
inputs:
  api-key:
    description: Neon API key scoped to the project.
    required: true
  project-id:
    description: Neon project id.
    required: true
  branch-id:
    description: Id of the branch to delete.
    required: true
runs:
  using: composite
  steps:
    # The Neon API directly, as neonctl does: delete-branch-action installs neonctl unpinned with `npm i -g`.
    # A branch that already expired is gone, which is the goal.
    - name: Delete the Neon CI branch
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.api-key }}
        PROJECT_ID: ${{ inputs.project-id }}
        BRANCH_ID: ${{ inputs.branch-id }}
      run: |
        status=$(curl -sS --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' -X DELETE \
          -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
          "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID")
        case "$status" in
          2??) echo "Deleted $BRANCH_ID" ;;
          404) echo "$BRANCH_ID was already gone" ;;
          *) echo "::error::Neon answered $status deleting $BRANCH_ID; it expires within the hour"; exit 1 ;;
        esac
