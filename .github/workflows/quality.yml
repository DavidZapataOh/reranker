name: quality
on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  # Previews are deployed by the preview workflow, which calls this once its deployment is live.
  workflow_call:
    inputs:
      url:
        required: true
        type: string
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test
        required: true
        type: string
      environment:
        description: Vercel environment of that deployment
        required: true
        type: choice
        options: [preview, production]
      sha:
        description: Commit the deployment was built from
        required: true
        type: string
permissions: {}
run-name: "quality · ${{ github.event.client_payload.environment || inputs.environment }} · ${{ github.event.client_payload.git.shortSha || inputs.sha }}"
concurrency:
  # The trigger is part of the key: Vercel's dispatch for a preview the preview workflow already
  # tests is ignored, and sharing a group would let it cancel the real run.
  group: quality-${{ github.event_name }}-${{ github.event.client_payload.git.sha || inputs.sha }}-${{ github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: true
jobs:
  quality:
    # Vercel matches Deployment Checks by name against check runs as well as commit statuses. A
    # dispatched run's check run lands on the head of main, not on the deployment's commit, and a
    # skipped preview dispatch counts as met, so only the commit status below may be called quality.
    name: deployment tests
    if: github.event_name != 'repository_dispatch' || (github.event.client_payload.project.name == 'reranker' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-24.04
    # Browsers and their system libraries ship in the image, so no step waits on an apt mirror.
    # The tag must match @playwright/test (apps/web/test/playwright-image.test.ts holds them together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The runner's uid owns the mounted workspace and HOME; --ipc=host keeps Chromium from
      # exhausting the container's 64 MB /dev/shm.
      options: --user 1001 --ipc=host --init
    timeout-minutes: 15
    permissions: { contents: read, statuses: write }
    env:
      DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
      APP_TARGET: ${{ github.event.client_payload.environment || inputs.environment }}
      TARGET_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
      # Only production writes `quality`, the name Deployment Checks require, so a green
      # preview of the same commit never satisfies it.
      STATUS_CONTEXT: ${{ (github.event.client_payload.environment || inputs.environment) == 'production' && 'quality' || 'quality (preview)' }}
    steps:
      # Not vercel/repository-dispatch/actions/status: its post step reports a cancelled or
      # timed-out run as success. The status is bound to the deployment's commit either way.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: "pending",
              context: process.env.STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      # Same ref resolution as vercel/repository-dispatch/actions/checkout, without persisting the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Runs before anything receives the bypass secret, so it never reaches a foreign host.
      - id: target
        name: Refuse untrusted deployment targets
        run: |
          case "$APP_TARGET" in
            preview | production) ;;
            *) echo "::error::Unknown deployment environment"; exit 1 ;;
          esac
          if ! origin=$(node packages/testing/bin/assert-target.ts "$DEPLOY_URL"); then
            echo "$origin"
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=$origin" >> "$GITHUB_ENV"
      - name: End-to-end and accessibility tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter web exec playwright test --project=desktop-chromium --project=mobile-chromium --project=mobile-webkit
      # Runs even when end-to-end failed, so one deployment reports every broken gate.
      # Never without the validated target: LHCI would fall back to a local server.
      - name: Lighthouse budgets
        if: ${{ !cancelled() && steps.target.outcome == 'success' }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # The image has no Google Chrome for LHCI to find, so it audits with Playwright's Chromium.
        run: |
          CHROME_PATH=$(pnpm --filter web exec node -p 'require("@playwright/test").chromium.executablePath()')
          export CHROME_PATH
          pnpm --filter web exec lhci autorun
      # Non-regression gate, once @reranker/quality exists:
      # pnpm --filter @reranker/quality compare --playwright apps/web/results.json --lhci apps/web/.lighthouseci --target "$APP_TARGET"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/results.json
            apps/web/.lighthouseci
          retention-days: 3
          if-no-files-found: ignore
          # .lighthouseci is a dot directory, skipped by default.
          include-hidden-files: true
      # Runs on cancellation and timeout too; anything but a full pass blocks the deployment.
      - if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { JOB_STATUS, STATUS_CONTEXT, TARGET_SHA } = process.env;
            const state = { success: "success", cancelled: "error" }[JOB_STATUS] ?? "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: TARGET_SHA,
              state,
              context: STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
