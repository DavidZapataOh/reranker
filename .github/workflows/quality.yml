name: quality
on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test
        required: true
        type: string
      environment:
        description: Vercel environment of that deployment
        required: true
        type: choice
        options: [preview, production]
      sha:
        description: Commit the deployment was built from
        required: true
        type: string
permissions: {}
run-name: "quality · ${{ github.event.client_payload.environment || inputs.environment }} · ${{ github.event.client_payload.git.shortSha || inputs.sha }}"
concurrency:
  group: quality-${{ github.event.client_payload.git.sha || inputs.sha }}-${{ github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.project.name == 'reranker'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read, statuses: write }
    env:
      DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
      APP_TARGET: ${{ github.event.client_payload.environment || inputs.environment }}
      TARGET_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
      # Only production writes `quality`, the name Deployment Checks require, so a green
      # preview of the same commit never satisfies it.
      STATUS_CONTEXT: ${{ (github.event.client_payload.environment || inputs.environment) == 'production' && 'quality' || 'quality (preview)' }}
    steps:
      # Not vercel/repository-dispatch/actions/status: its post step reports a cancelled or
      # timed-out run as success. The status is bound to the deployment's commit either way.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: "pending",
              context: process.env.STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      # Same ref resolution as vercel/repository-dispatch/actions/checkout, without persisting the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Runs before anything receives the bypass secret, so it never reaches a foreign host.
      - id: target
        name: Refuse untrusted deployment targets
        run: |
          case "$APP_TARGET" in
            preview | production) ;;
            *) echo "::error::Unknown deployment environment"; exit 1 ;;
          esac
          if ! origin=$(node packages/testing/bin/assert-target.ts "$DEPLOY_URL"); then
            echo "$origin"
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=$origin" >> "$GITHUB_ENV"
      - id: browsers
        name: Resolve Playwright browsers
        run: |
          echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          if [ "$APP_TARGET" = production ]; then
            echo "list=chromium webkit" >> "$GITHUB_OUTPUT"
          else
            echo "list=chromium" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browsers.outputs.version }}-${{ steps.browsers.outputs.list }}
      - name: Install browsers
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: |
          # shellcheck disable=SC2086
          pnpm --filter web exec playwright install --with-deps $BROWSERS
      # WebKit runs only in production to stay inside the free Actions minutes.
      - name: End-to-end and accessibility tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          projects=(--project=desktop-chromium --project=mobile-chromium)
          if [ "$APP_TARGET" = production ]; then projects+=(--project=mobile-webkit); fi
          pnpm --filter web exec playwright test "${projects[@]}"
      # Runs even when end-to-end failed, so one deployment reports every broken gate.
      # Never without the validated target: LHCI would fall back to a local server.
      - name: Lighthouse budgets
        if: ${{ !cancelled() && steps.target.outcome == 'success' }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter web exec lhci autorun
      # Non-regression gate, once @reranker/quality exists:
      # pnpm --filter @reranker/quality compare --playwright apps/web/results.json --lhci apps/web/.lighthouseci --target "$APP_TARGET"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/results.json
            apps/web/.lighthouseci
          retention-days: 3
          if-no-files-found: ignore
          # .lighthouseci is a dot directory, skipped by default.
          include-hidden-files: true
      # Runs on cancellation and timeout too; anything but a full pass blocks the deployment.
      - if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { JOB_STATUS, STATUS_CONTEXT, TARGET_SHA } = process.env;
            const state = { success: "success", cancelled: "error" }[JOB_STATUS] ?? "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: TARGET_SHA,
              state,
              context: STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
