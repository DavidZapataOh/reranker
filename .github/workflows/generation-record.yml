name: generation-record
# Spends real money on the generation providers, so it only ever runs when dispatched.
on:
  workflow_dispatch:
    inputs:
      language:
        description: Measurement language whose generated paraphrases to record
        type: choice
        options: [es, en, pt, fr, de, it]
        default: de
permissions: {}
concurrency:
  group: generation-record
  cancel-in-progress: false
jobs:
  record:
    # Only reviewed code reaches the production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then twelve paraphrase calls per seed category.
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Every call is reserved and settled on the spend ledger under the contract-test cap.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/generation-record-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - name: Record generated paraphrases
        env:
          APP_ENV: development
          LANGUAGE: ${{ inputs.language }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_CI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
          # Five categories of twelve calls reserve under US$1; the ledger refuses anything past US$1.50.
          SPEND_CAP_DAILY_CONTRACT_TEST_USD: "1.5"
          OUT_DIR: ${{ runner.temp }}/generation-record
        run: pnpm --filter @reranker/catalog record:generation "$LANGUAGE" "$OUT_DIR"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generation-record-${{ inputs.language }}
          path: ${{ runner.temp }}/generation-record
          retention-days: 7
          if-no-files-found: error
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
