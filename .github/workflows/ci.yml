name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with: { team: "${{ vars.TURBO_TEAM }}" }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      - run: pnpm exec biome ci .
      - run: pnpm audit --prod --audit-level high && pnpm licenses:check
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Without a reachable base (first push, force push, manual run) everything runs.
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}"; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "affected=--affected" >> "$GITHUB_OUTPUT"
          else
            echo "affected=" >> "$GITHUB_OUTPUT"
          fi
      - id: browser
        name: Detect affected component tests
        env:
          TURBO_SCM_BASE: ${{ steps.scope.outputs.base }}
        run: |
          dirs=$(pnpm exec turbo ls ${{ steps.scope.outputs.affected }} --output=json | jq -r '.packages.items[].path')
          # shellcheck disable=SC2086
          if [ -n "$dirs" ] && [ -n "$(git ls-files -- $(printf "%s/**/*.browser.test.tsx " $dirs))" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.version }}
      - if: steps.browser.outputs.needed == 'true'
        name: Install Chromium when component tests are affected
        run: pnpm --filter web exec playwright install --with-deps chromium
      - env:
          TURBO_SCM_BASE: ${{ steps.scope.outputs.base }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: pnpm exec turbo run typecheck test ${{ steps.scope.outputs.affected }} --summarize
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-summary
          path: .turbo/runs/*.json
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with: { team: "${{ vars.TURBO_TEAM }}" }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}"; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "affected=--affected" >> "$GITHUB_OUTPUT"
          else
            echo "affected=" >> "$GITHUB_OUTPUT"
          fi
      - id: affected
        name: Detect affected integration tests
        env:
          BASE: ${{ steps.scope.outputs.base }}
          FILTER: ${{ steps.scope.outputs.affected }}
          TURBO_SCM_BASE: ${{ steps.scope.outputs.base }}
        # Turbo lists packages without the script as <NONEXISTENT> and adds ^typecheck dependencies.
        # It also ignores the files below, which decide how the integration tests run, so they force a full run.
        run: |
          if [ -n "$BASE" ] && [ -n "$(git diff --name-only "$BASE" HEAD -- .github/actions .github/workflows/ci.yml package.json pnpm-workspace.yaml pnpm-lock.yaml vitest.config.ts)" ]; then
            echo "Integration infrastructure changed, running every integration test"
            FILTER=""
          fi
          # shellcheck disable=SC2086
          count=$(pnpm exec turbo run test:integration $FILTER --dry=json \
            | jq '[.tasks[] | select(.task == "test:integration" and .command != "<NONEXISTENT>")] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          if [ "$count" = 0 ]; then echo "No integration tests affected"; fi
      - if: steps.affected.outputs.count != '0'
        id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/run-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.affected.outputs.count != '0'
        id: db
        uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - if: steps.affected.outputs.count != '0'
        env:
          DATABASE_URL: ${{ steps.db.outputs.database-url }}
          DATABASE_URL_SYSTEM: ${{ steps.db.outputs.database-url-system }}
          DATABASE_URL_MIGRATIONS: ${{ steps.branch.outputs.db-url }}
          FILTER: ${{ steps.affected.outputs.filter }}
          TURBO_SCM_BASE: ${{ steps.scope.outputs.base }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: pnpm exec turbo run test:integration $FILTER
      - if: steps.affected.outputs.count != '0' && github.event_name == 'pull_request'
        id: migrations
        name: Detect migration changes
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- packages/db/migrations; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration changes"
          fi
      # A separate full checkout: the partial clone above cannot fetch the base's blobs without credentials.
      - if: steps.migrations.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.scope.outputs.base }}
          path: n-1
          persist-credentials: false
      # The deployed app (N-1) keeps running while a migration rolls out, so it must still work on the new schema.
      - if: steps.migrations.outputs.changed == 'true'
        name: Run the base branch's database tests against the new schema
        working-directory: n-1
        env:
          DATABASE_URL: ${{ steps.db.outputs.database-url }}
          DATABASE_URL_SYSTEM: ${{ steps.db.outputs.database-url-system }}
          DATABASE_URL_MIGRATIONS: ${{ steps.branch.outputs.db-url }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          if [ ! -d packages/db ]; then echo "The base branch has no database package yet"; exit 0; fi
          pnpm exec turbo run test:integration --filter=@reranker/db
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: ./.github/actions/neon-ci-branch-delete
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-id: ${{ steps.branch.outputs.branch-id }}
  security:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: uvx zizmor@1.32.0 --min-severity medium .github/
