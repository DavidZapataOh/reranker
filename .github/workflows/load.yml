name: load
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Preview deployment URL (production is refused)
        required: true
        type: string
      scenario_glob:
        description: Scenario files under load/, e.g. load/web/*.js
        required: true
        type: string
      scenario:
        description: nominal, or stress at 10× the nominal rate
        required: true
        default: nominal
        type: choice
        options: [nominal, stress]
      p95_ms:
        description: Overrides the scenarios' p95 budget in ms
        required: false
        type: string
permissions: {}
run-name: "load · ${{ inputs.scenario_glob }} · ${{ inputs.scenario }}"
concurrency:
  group: load
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    env:
      TARGET_URL: ${{ inputs.target_url }}
      SCENARIO_GLOB: ${{ inputs.scenario_glob }}
      SCENARIO: ${{ inputs.scenario }}
      P95_MS: ${{ inputs.p95_ms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Only the Node runtime for the guard: k6 runs its own JS, so no dependencies.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { install: false }
      # Runs before anything receives the bypass secret, so it never reaches a foreign host.
      - name: Refuse production and untrusted targets
        run: |
          if ! origin=$(node packages/testing/bin/assert-target.ts "$TARGET_URL" --preview-only); then
            echo "$origin"
            exit 1
          fi
          echo "TARGET_URL=$origin" >> "$GITHUB_ENV"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with: { k6-version: "2.3.0" }
      # k6 reads TARGET_URL, SCENARIO, P95_MS and the secret from the environment.
      - name: Run scenarios
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          shopt -s globstar nullglob
          # shellcheck disable=SC2206
          files=($SCENARIO_GLOB)
          scenarios=()
          for file in "${files[@]}"; do
            case "$file" in
              load/lib/*) ;;
              *..*) echo "::error::Not a scenario under load/: $(jq -Rn --arg f "$file" '$f')"; exit 1 ;;
              load/*.js) scenarios+=("$file") ;;
              *) echo "::error::Not a scenario under load/: $(jq -Rn --arg f "$file" '$f')"; exit 1 ;;
            esac
          done
          if [ "${#scenarios[@]}" -eq 0 ]; then
            echo "::error::No scenario matches the glob"
            exit 1
          fi
          mkdir -p summaries
          failed=0
          # Every scenario runs even after one breaches its budget, so one dispatch reports them all.
          for file in "${scenarios[@]}"; do
            name=${file#load/}
            k6 run --summary-export "summaries/${name//\//-}.json" "$file" || failed=1
          done
          exit "$failed"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-summaries
          path: summaries
          retention-days: 3
          if-no-files-found: ignore
