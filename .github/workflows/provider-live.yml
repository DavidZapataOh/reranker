name: provider-live
# Spends real money on production provider endpoints, so it only ever runs when dispatched.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider whose production answers to record
        type: choice
        options: [dataforseo, brightdata]
        default: dataforseo
      snapshots:
        description: Bright Data snapshot ids a run left pending, space-separated, to collect instead
        type: string
        default: ""
permissions: {}
concurrency:
  group: provider-live
  cancel-in-progress: false
jobs:
  record:
    # Only reviewed code reaches the production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then about twenty DataForSEO Live calls of
    # up to 2 min, or six concurrent Bright Data scrapes of up to 4 min.
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Every call is reserved and settled on the spend ledger under the contract-test cap.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/provider-live-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - name: Record DataForSEO production answers
        if: inputs.provider == 'dataforseo'
        env:
          APP_ENV: development
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OUT_DIR: ${{ runner.temp }}/dataforseo-live
        run: pnpm --filter @reranker/capture record:live "$OUT_DIR"
      - name: Record Bright Data production answers
        if: inputs.provider == 'brightdata'
        env:
          APP_ENV: development
          BRIGHTDATA_API_KEY_CI: ${{ secrets.BRIGHTDATA_API_KEY_CI }}
          BRIGHTDATA_BILLING_API_KEY_CI: ${{ secrets.BRIGHTDATA_BILLING_API_KEY_CI }}
          OUT_DIR: ${{ runner.temp }}/brightdata-live
          SNAPSHOTS: ${{ inputs.snapshots }}
        # Word splitting is wanted: each id is its own argument, and the script validates them.
        run: |
          # shellcheck disable=SC2086
          pnpm --filter @reranker/capture record:brightdata "$OUT_DIR" $SNAPSHOTS
      # The exact bytes, for the parser tests under packages/capture/test/fixtures/recorded.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.provider }}-live
          path: ${{ runner.temp }}/${{ inputs.provider }}-live
          retention-days: 3
          if-no-files-found: error
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
