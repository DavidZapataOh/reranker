name: seed-build
# Spends real money on the generation providers, so it only ever runs when dispatched.
on:
  workflow_dispatch:
    inputs:
      group:
        description: Seed group (language and speech profile) whose candidate pool to build
        type: choice
        options: [es-co, es-neutral, en-neutral, pt-neutral, fr-neutral, de-neutral, it-neutral]
permissions: {}
concurrency:
  group: seed-build-${{ inputs.group }}
  cancel-in-progress: false
jobs:
  build:
    # Only reviewed code reaches the production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then up to three rounds per intent.
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Every call is reserved and settled on the spend ledger under the benchmark cap.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/seed-build-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - name: Build the group's candidate pool
        env:
          APP_ENV: development
          GROUP: ${{ inputs.group }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_CI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
          # A group spends about US$1.50; each run has a ledger of its own, so the caps are per
          # group. Outside production every provider is capped at zero unless raised here.
          SPEND_CAP_DAILY_BENCHMARK_USD: "6"
          SPEND_CAP_DAILY_OPENAI_USD: "6"
          SPEND_CAP_DAILY_GEMINI_USD: "6"
          OUT_DIR: ${{ runner.temp }}/seed-build
        run: pnpm --filter @reranker/catalog seed:build "${GROUP%-*}" "${GROUP#*-}" "$OUT_DIR"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seed-build-${{ inputs.group }}
          path: ${{ runner.temp }}/seed-build
          retention-days: 30
          if-no-files-found: error
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
