name: nightly
on:
  schedule:
    # 05:00 in Bogotá.
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then the tests.
    timeout-minutes: 25
    permissions: { contents: read }
    outputs:
      failed: ${{ steps.tests.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Contract tests that write what a provider returns (the network lists) need a database.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/contract-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      # The OpenTimestamps reference client: the evidence contract tests compare our proofs with its output.
      - name: Install the OpenTimestamps client
        run: pipx install opentimestamps-client==0.8.0
      # golang.org/x/mod/sumdb/tlog checks the log tiles the evidence contract tests publish.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: packages/evidence/test/go/go.sum
      # A missing secret fails the contract tests that need it; they never skip. Every package runs
      # even after one fails, so a night reports each broken adapter instead of the first.
      - id: tests
        name: Contract tests
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          BRIGHTDATA_API_KEY_CI: ${{ secrets.BRIGHTDATA_API_KEY_CI }}
          BRIGHTDATA_BILLING_API_KEY_CI: ${{ secrets.BRIGHTDATA_BILLING_API_KEY_CI }}
          OPENAI_API_KEY_CI: ${{ secrets.OPENAI_API_KEY_CI }}
          GEMINI_API_KEY_CI: ${{ secrets.GEMINI_API_KEY_CI }}
          GOOGLE_PLACES_API_KEY_CI: ${{ secrets.GOOGLE_PLACES_API_KEY_CI }}
          ANTHROPIC_API_KEY_CI: ${{ secrets.ANTHROPIC_API_KEY_CI }}
          XAI_API_KEY_CI: ${{ secrets.XAI_API_KEY_CI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_CI }}
          # db:usage reads the organization-wide consumption endpoint, out of reach of the
          # project-scoped NEON_NONPROD_API_KEY.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_CI }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          POSTHOG_READONLY_API_KEY: ${{ secrets.POSTHOG_READONLY_API_KEY }}
          POSTHOG_FEATURE_FLAGS_KEY: ${{ secrets.POSTHOG_READONLY_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN_CI }}
          POSTHOG_QUERY_READ_KEY: ${{ secrets.POSTHOG_QUERY_READ_KEY_CI }}
          GITHUB_BILLING_READ_TOKEN: ${{ secrets.GH_BILLING_READ_TOKEN_CI }}
          R2_ACCESS_KEY_ID_CI: ${{ secrets.R2_ACCESS_KEY_ID_CI }}
          R2_SECRET_ACCESS_KEY_CI: ${{ secrets.R2_SECRET_ACCESS_KEY_CI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Reads the private bucket's domain settings and purges removed preview artifacts.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          status=0
          pnpm exec turbo run test:contract --continue=dependencies-successful --summarize || status=$?
          failed=$(jq -r '[.tasks[] | select((.execution.exitCode // 0) != 0) | .taskId] | join(" ")' .turbo/runs/*.json)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit "$status"
      # The sandbox bytes the parser tests replay; a run's artifact is how they are refreshed.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-recordings
          path: packages/*/test/fixtures/recorded/sandbox
          retention-days: 3
          if-no-files-found: ignore
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
  full:
    runs-on: ubuntu-24.04
    # Browsers and their system libraries ship in the image, so no step waits on an apt mirror.
    # The tag must match @playwright/test (apps/web/test/playwright-image.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The runner's uid owns the mounted workspace and HOME; --ipc=host keeps Chromium from
      # exhausting the container's 64 MB /dev/shm.
      options: --user 1001 --ipc=host --init
    timeout-minutes: 30
    permissions: { contents: read }
    outputs:
      tests: ${{ steps.tests.outcome }}
      smoke: ${{ steps.smoke.outcome }}
      bench: ${{ steps.bench.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/nightly-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      # Every package, uncached: the nightly is the run that catches what --affected and the cache let through.
      - id: tests
        name: Unit, component and integration tests
        run: pnpm exec turbo run test test:integration --force
      # Runs even when the tests above failed, so one night reports every broken gate.
      # Retries stay on to tell flaky from broken, and a test that only passes on retry fails the night.
      - id: smoke
        name: Smoke tests against production
        if: ${{ !cancelled() }}
        env:
          STRICT_FLAKY: "1"
          PLAYWRIGHT_BASE_URL: https://reranker.co
          # Production-only smoke checks (the PostHog proxy, analytics after consent) skip under the default "local".
          APP_TARGET: production
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter web test:smoke
      # On a shared runner the relative gate only catches gross regressions; production measures
      # the strict budgets. Suspending the compute is safe: the branch belongs to this run alone,
      # and the script refuses any branch whose name does not start with ci/.
      - id: bench
        name: Benchmark tenant transactions and the cold start
        if: ${{ !cancelled() && steps.branch.outputs.branch-id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_NONPROD_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.branch.outputs.branch-id }}
        run: pnpm --filter @reranker/db db:bench
      # delete-branch-action runs `npm i -g neonctl@v2`: pnpm's Node runtime keeps no global bin on PATH, and an
      # unlocked global install would otherwise resolve to whatever was published last and run its install scripts.
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/results.json
            packages/db/bench-report.json
          retention-days: 3
          if-no-files-found: ignore
  report:
    needs: [contract, full]
    # Also after a cancellation or a timeout: a night that did not pass must never look green.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      # Only main reports: a run dispatched on a branch must neither page nor close an issue about main.
      - if: github.ref == 'refs/heads/main' && needs.contract.result == 'success' && needs.full.result == 'success'
        name: Send the heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_NIGHTLY_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "No heartbeat configured"
            exit 0
          fi
          curl -fsS --retry 3 -o /dev/null "$HEARTBEAT_URL"
      # One issue per failing contract package or full-suite gate, so each cause is tracked and closed
      # on its own; a red night comments on the open issue of the same failure instead of opening another.
      - name: Open, update or close the failure issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ github.ref == 'refs/heads/main' }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CONTRACT_FAILED: ${{ needs.contract.outputs.failed }}
          FULL_RESULT: ${{ needs.full.result }}
          FULL_TESTS: ${{ needs.full.outputs.tests }}
          FULL_SMOKE: ${{ needs.full.outputs.smoke }}
          FULL_BENCH: ${{ needs.full.outputs.bench }}
        run: |
          declare -A failing=()
          # Jobs that ran to the end, so an open issue of theirs that did not fail tonight is fixed.
          finished=()

          if [ "$CONTRACT_RESULT" = success ]; then
            finished+=(contract)
          elif [ "$CONTRACT_RESULT" = failure ] && [ -n "$CONTRACT_FAILED" ]; then
            finished+=(contract)
            for task in $CONTRACT_FAILED; do failing["Nightly contract: $task"]=1; done
          else
            failing["Nightly contract: job $CONTRACT_RESULT"]=1
          fi

          gates=()
          if [ "$FULL_TESTS" = failure ]; then gates+=("unit, component and integration tests"); fi
          if [ "$FULL_SMOKE" = failure ]; then gates+=("smoke tests against production"); fi
          if [ "$FULL_BENCH" = failure ]; then gates+=("benchmarks"); fi
          if [ "$FULL_RESULT" = success ]; then
            finished+=(full)
          elif [ "$FULL_RESULT" = failure ] && [ "${#gates[@]}" -gt 0 ]; then
            finished+=(full)
            for gate in "${gates[@]}"; do failing["Nightly full: $gate"]=1; done
          else
            failing["Nightly full: job $FULL_RESULT"]=1
          fi

          {
            echo "## Nightly"
            if [ "${#failing[@]}" -eq 0 ]; then echo "Every gate passed."; fi
            for title in "${!failing[@]}"; do echo "- $title"; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRACK" != true ]; then exit 0; fi

          gh label create nightly-failure --force --color B60205 --description "The nightly run failed"
          open=$(gh issue list --label nightly-failure --state open --limit 200 --json number,title)
          for title in "${!failing[@]}"; do
            issue=$(jq -r --arg title "$title" 'first(.[] | select(.title == $title) | .number) // empty' <<< "$open")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again: $RUN_URL"
            else
              gh issue create --label nightly-failure --title "$title" \
                --body "First failed in $RUN_URL. Runbook: docs/runbooks/nightly-failure.md"
            fi
          done
          for job in "${finished[@]}"; do
            jq -r --arg prefix "Nightly $job: " '.[] | select(.title | startswith($prefix)) | "\(.number)\t\(.title)"' <<< "$open" |
              while IFS=$'\t' read -r issue title; do
                if [ -z "${failing[$title]:-}" ]; then
                  gh issue close "$issue" --comment "Passed in $RUN_URL"
                fi
              done
          done
