name: r2
# Brings the R2 buckets, their public domains, r2.dev access and CORS to the state declared in
# packages/evidence/scripts/provision-r2.ts. Every run is idempotent and ends with the observed state.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the changes without making them
        type: boolean
        default: false
permissions: {}
concurrency:
  group: r2
  cancel-in-progress: false
jobs:
  provision:
    # The infrastructure token reaches production buckets, so only main's declaration is applied.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A new custom domain can take minutes to get its certificate.
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Only the Node runtime: the script uses nothing beyond fetch.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { install: false }
      - name: Provision the R2 buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node packages/evidence/scripts/provision-r2.ts --dry-run
          else
            node packages/evidence/scripts/provision-r2.ts
          fi
      - if: ${{ !inputs.dry-run }}
        name: Check that every public domain serves over TLS
        run: |
          status=0
          for host in ev.reranker.co log.reranker.co ev-preview.reranker.co log-preview.reranker.co; do
            code=$(curl -sS --tlsv1.2 -o /dev/null -w '%{http_code}' "https://$host/") || code=failed
            echo "https://$host/ answered $code"
            # A bucket root holds no object, so a working domain answers 404.
            if [ "$code" != 404 ]; then echo "::error::https://$host/ answered $code"; status=1; fi
          done
          exit "$status"
