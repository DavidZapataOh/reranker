name: measure
# Rates measured on live providers. They move slowly and cost more than a contract check, so they
# run weekly instead of nightly.
on:
  schedule:
    # Mondays, 05:00 in Bogotá.
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      measurement:
        description: Measurement to run; a schedule runs them all
        type: choice
        options: [all, places-region-bias, extraction-languages]
        default: all
permissions: {}
concurrency:
  group: measure
  cancel-in-progress: false
jobs:
  places-region-bias:
    if: inputs.measurement == '' || inputs.measurement == 'all' || inputs.measurement == 'places-region-bias'
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then twenty rounds of three searches.
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Every search is reserved and settled on the spend ledger.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/measure-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - name: Measure the Places region bias
        env:
          GOOGLE_PLACES_API_KEY_CI: ${{ secrets.GOOGLE_PLACES_API_KEY_CI }}
          # Sixty Text Search Pro calls reserve 1.92 USD; the ledger belongs to this run alone.
          SPEND_CAP_DAILY_CONTRACT_TEST_USD: "2.5"
        run: pnpm --filter @reranker/extraction test:measure test/places/region-bias.measure.test.ts
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
  extraction-languages:
    if: inputs.measurement == '' || inputs.measurement == 'all' || inputs.measurement == 'extraction-languages'
    runs-on: ubuntu-24.04
    # Up to 15 min queueing for a Neon CI branch slot, then one extraction per recorded answer.
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { cache: true, require-lockfile: true }
      # Every model call is reserved and settled on the spend ledger.
      - id: branch
        uses: ./.github/actions/neon-ci-branch
        with:
          api-key: ${{ secrets.NEON_NONPROD_API_KEY }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: ci/measure-extraction-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/ci-database
        with:
          db-url: ${{ steps.branch.outputs.db-url }}
          db-host-pooled: ${{ steps.branch.outputs.db-host-pooled }}
      - name: Measure extraction in every measurement language
        env:
          OPENAI_API_KEY_CI: ${{ secrets.OPENAI_API_KEY_CI }}
          GEMINI_API_KEY_CI: ${{ secrets.GEMINI_API_KEY_CI }}
          # About sixty extractions with their judge calls stay well under a dollar.
          SPEND_CAP_DAILY_CONTRACT_TEST_USD: "2"
        run: pnpm --filter @reranker/extraction test:measure test/extract-languages.measure.test.ts
      - if: always() && steps.branch.outputs.branch-id != ''
        name: Prepare npm for the branch cleanup
        env:
          PREFIX: ${{ runner.temp }}/npm-global
        run: |
          {
            echo "NPM_CONFIG_PREFIX=$PREFIX"
            echo "NPM_CONFIG_BEFORE=2026-11-01T00:00:00Z"
            echo "NPM_CONFIG_IGNORE_SCRIPTS=true"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - if: always() && steps.branch.outputs.branch-id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch-id }}
          api_key: ${{ secrets.NEON_NONPROD_API_KEY }}
  report:
    needs: [places-region-bias, extraction-languages]
    if: always() && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        measurement: [places-region-bias, extraction-languages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      # One issue for the measurement: a red week comments on it, a green one closes it.
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs[matrix.measurement].result }}
          MEASUREMENT: ${{ matrix.measurement }}
        run: |
          # A measurement left out of a dispatched run has nothing to report.
          if [ "$RESULT" = skipped ]; then exit 0; fi
          title="Weekly measure: ${MEASUREMENT//-/ }"
          gh label create nightly-failure --force --color B60205 --description "The nightly run failed"
          issue=$(gh issue list --label nightly-failure --state open --json number,title |
            jq -r --arg title "$title" 'first(.[] | select(.title == $title) | .number) // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Passed in $RUN_URL"; fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again ($RESULT): $RUN_URL"
          else
            gh issue create --label nightly-failure --title "$title" \
              --body "First failed ($RESULT) in $RUN_URL. Runbook: docs/runbooks/nightly-failure.md"
          fi
