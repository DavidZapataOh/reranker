pg_version = "18.0"
# The runner applies every pending migration inside one transaction; files under migrations/concurrent
# opt out with -- squawk-disable-assume-in-transaction.
assume_in_transaction = true
excluded_rules = [
  # The runner sets lock_timeout and statement_timeout on the session before migrating.
  "require-timeout-settings",
  # Migrations run exactly once inside a recorded transaction, so IF NOT EXISTS guards add nothing.
  "prefer-robust-stmts",
]
